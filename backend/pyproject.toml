[project]
name = "christianity-ai-assistant"
version = "0.1.0"
description = "Christianity-focused, grounded, denomination-aware AI assistant"
readme = "README.md"
requires-python = ">=3.12,<3.13"

dependencies = [
    # web
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    # logging
    "structlog>=24.4",
    # agent + llm
    "langgraph>=0.2.45",
    "langchain-core>=0.3",
    "google-genai>=1.0",
    # data layer
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    # embeddings (local, no API)
    "sentence-transformers>=3.3",
    "httpx>=0.27",
    "pypdf>=6.12.2",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]
